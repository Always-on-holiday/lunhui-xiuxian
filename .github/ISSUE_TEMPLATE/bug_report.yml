name: Bug 报告
description: 报告游戏、联机、启动器或存档问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请不要上传账号密码、访问令牌、个人信息或完整世界存档。
  - type: dropdown
    id: area
    attributes:
      label: 问题类型
      options:
        - 游戏页面
        - 房间与联机
        - 战斗或事件
        - 死亡与转生
        - 世界存档
        - 一键启动器
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序说明出现问题前做了什么。
      placeholder: |
        1. 启动游戏
        2. 创建或加入房间
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 说明实际发生了什么，也可以拖入截图。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 说明你原本认为应该发生什么。
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: 出现频率
      options:
        - 每次都会出现
        - 偶尔出现
        - 只出现过一次
        - 不确定
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 使用环境
      description: 例如 Windows 11、Chrome、本地启动或朋友通过邀请网址加入。
      placeholder: Windows 11 / Chrome / 房主本地启动
  - type: textarea
    id: logs
    attributes:
      label: 补充信息
      description: 可填写相关报错、房间人数、PVP 是否开启等。请先删除隐私信息。
