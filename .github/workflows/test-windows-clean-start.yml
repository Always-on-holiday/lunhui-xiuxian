name: Windows 干净环境启动检查

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/start-online.ps1"
      - "一键启动互联网联机.bat"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/test-windows-clean-start.yml"
  pull_request:
    paths:
      - "scripts/start-online.ps1"
      - "一键启动互联网联机.bat"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/test-windows-clean-start.yml"

jobs:
  codex-runtime-without-pnpm-on-path:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: 获取代码
        uses: actions/checkout@v7

      - name: 准备与用户电脑相同的 Codex 运行目录
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          package-manager-cache: false

      - name: 验证内置 pnpm 不在 PATH 时仍可安装
        shell: pwsh
        run: |
          $dependenciesRoot = Join-Path $env:RUNNER_TEMP "codex-dependencies"
          $nodeRoot = Join-Path $dependenciesRoot "node"
          $nodeBin = Join-Path $nodeRoot "bin"
          New-Item -ItemType Directory -Force -Path $nodeBin | Out-Null
          Copy-Item (Get-Command node).Source (Join-Path $nodeBin "node.exe")
          npm install --prefix $nodeRoot pnpm@11.19.0 --no-audit --no-fund

          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          cmd.exe /d /c "`"$PWD\一键启动互联网联机.bat`" -DependenciesRoot `"$dependenciesRoot`" -InstallDependenciesOnly -NoPause"
          if ($LASTEXITCODE -ne 0) {
            throw "启动器没有找到 Codex 内置的 pnpm。"
          }

          if (-not (Test-Path -LiteralPath "node_modules/wrangler/bin/wrangler.js")) {
            throw "内置 pnpm 没有完成依赖安装。"
          }

  clean-windows-start:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: 获取代码
        uses: actions/checkout@v7

      - name: 准备一份版本过旧的 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.18.0
          package-manager-cache: false

      - name: 模拟只有旧 Node.js 且没有 pnpm 的电脑
        shell: pwsh
        run: |
          $cleanProfile = Join-Path $env:RUNNER_TEMP "clean-user"
          $cleanLocalAppData = Join-Path $cleanProfile "AppData/Local"
          $oldNodeDirectory = Split-Path -Parent (Get-Command node).Source
          New-Item -ItemType Directory -Force -Path $cleanProfile, $cleanLocalAppData | Out-Null

          $env:USERPROFILE = $cleanProfile
          $env:LOCALAPPDATA = $cleanLocalAppData
          $env:PATH = "$oldNodeDirectory;$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"

          cmd.exe /d /c "`"$PWD\一键启动互联网联机.bat`" -InstallDependenciesOnly -NoPause"
          if ($LASTEXITCODE -ne 0) {
            throw "一键启动器未能在干净 Windows 环境中自动准备依赖。"
          }

          $node = Join-Path $cleanLocalAppData "轮回仙途/开发运行时/node-v22.13.0-win-x64/node.exe"
          $wrangler = Join-Path $PWD "node_modules/wrangler/bin/wrangler.js"
          if (-not (Test-Path -LiteralPath $node)) {
            throw "没有生成游戏专用 Node.js。"
          }
          if (-not (Test-Path -LiteralPath $wrangler)) {
            throw "没有安装 Wrangler。"
          }

          & $node --version
          if ($LASTEXITCODE -ne 0) {
            throw "游戏专用 Node.js 无法运行。"
          }

      - name: 检查并构建网页
        shell: pwsh
        run: |
          $node = Join-Path $env:RUNNER_TEMP "clean-user/AppData/Local/轮回仙途/开发运行时/node-v22.13.0-win-x64/node.exe"
          & $node scripts/validate-content.mjs
          if ($LASTEXITCODE -ne 0) { throw "内容检查失败。" }

          & $node scripts/run-framework.mjs build
          if ($LASTEXITCODE -ne 0) { throw "网页构建失败。" }

          if (-not (Test-Path -LiteralPath "dist/server/wrangler.json")) {
            throw "网页构建没有生成 Wrangler 配置。"
          }

      - name: 启动真实服务器并访问游戏页
        shell: pwsh
        run: |
          $node = Join-Path $env:RUNNER_TEMP "clean-user/AppData/Local/轮回仙途/开发运行时/node-v22.13.0-win-x64/node.exe"
          $wrangler = Join-Path $PWD "node_modules/wrangler/bin/wrangler.js"
          $save = Join-Path $env:RUNNER_TEMP "smoke-world"
          $serverOut = Join-Path $env:RUNNER_TEMP "game-server.out.log"
          $serverErr = Join-Path $env:RUNNER_TEMP "game-server.err.log"
          New-Item -ItemType Directory -Force -Path $save | Out-Null
          $env:CI = "true"

          & $node $wrangler d1 migrations apply DB --config wrangler.save.json --local --persist-to $save
          if ($LASTEXITCODE -ne 0) { throw "世界存档迁移失败。" }

          $serverArguments = @(
            "--import", (Join-Path $PWD "scripts/sites-env.mjs"),
            $wrangler,
            "dev",
            "--config", (Join-Path $PWD "dist/server/wrangler.json"),
            "--local",
            "--persist-to", $save,
            "--ip", "127.0.0.1",
            "--port", "8787",
            "--inspector-port", "0"
          )
          $server = Start-Process `
            -FilePath $node `
            -ArgumentList $serverArguments `
            -WorkingDirectory $PWD `
            -RedirectStandardOutput $serverOut `
            -RedirectStandardError $serverErr `
            -PassThru

          $ready = $false
          try {
            for ($attempt = 0; $attempt -lt 90; $attempt++) {
              if ($server.HasExited) { break }
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8787/" -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content.Length -gt 100) {
                  $ready = $true
                  break
                }
              }
              catch {
                Start-Sleep -Seconds 1
              }
            }
          }
          finally {
            if (-not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
            }
          }

          if (-not $ready) {
            if (Test-Path $serverOut) { Get-Content $serverOut }
            if (Test-Path $serverErr) { Get-Content $serverErr }
            throw "游戏服务器没有返回可用页面。"
          }
